services:
  postgres:
    image: postgres:16-alpine
    container_name: placementhub_postgres
    environment:
      POSTGRES_USER: hub_user
      POSTGRES_PASSWORD: hub_password
      POSTGRES_DB: placement_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: placementhub_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: